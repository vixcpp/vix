name: current-vix-release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: current-vix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Required release qualification
    uses: ./.github/workflows/release-qualification.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    name: Protected signed publication (intentionally disabled)
    # Keep official publication fail-closed until production environment,
    # trust provisioning, managed HTTPS upgrade/rollback qualification, and
    # platform release evidence have been reviewed and validated.
    if: ${{ false }}
    needs: qualify
    runs-on: ubuntu-24.04
    environment: vix-production-release
    permissions:
      contents: write
      attestations: read
    env:
      VIX_RELEASE_KEY_ID: ${{ vars.VIX_RELEASE_KEY_ID }}
      VIX_RELEASE_AUTHORITY_PUBLIC_KEY_HEX: ${{ vars.VIX_RELEASE_AUTHORITY_PUBLIC_KEY_HEX }}
      VIX_OFFICIAL_RELEASE_BASE_URL: ${{ vars.VIX_OFFICIAL_RELEASE_BASE_URL }}
    steps:
      - name: Download immutable release-qualified outputs
        uses: actions/download-artifact@v6
        with:
          name: vix-release-x86_64-linux-gnu
          path: dist
      - name: Reverify exact candidate digests and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          (cd dist && sha256sum --check QUALIFIED-SHA256SUMS)
          version="${GITHUB_REF_NAME#v}"
          host_archive="dist/vix-x86_64-linux-gnu-${version}.tar.gz"
          bootstrap_archive="dist/vix-installer-x86_64-linux-gnu-${version}.tar.gz"
          gh attestation verify "$host_archive" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$bootstrap_archive" --repo "$GITHUB_REPOSITORY"
          for target_archive in dist/target-sdks/*.tar.gz; do
            gh attestation verify "$target_archive" --repo "$GITHUB_REPOSITORY"
          done
          gh attestation verify dist/vix-release-tool --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/release-build-info.toml --repo "$GITHUB_REPOSITORY"
          chmod +x dist/vix-release-tool
          test "$(sed -n 's/^root = "\([^"]*\)"$/\1/p' dist/release-build-info.toml)" = "$GITHUB_SHA"
          test "$(sed -n 's/^release = "\([^"]*\)"$/\1/p' dist/release-build-info.toml)" = "${GITHUB_REF_NAME}"
          test "$(sed -n 's/^cli_version = "\([^"]*\)"$/\1/p' dist/release-build-info.toml)" = "${GITHUB_REF_NAME#v}"
          test "$(sed -n 's/^sdk = "\([^"]*\)"$/\1/p' dist/release-build-info.toml)" = "${GITHUB_REF_NAME#v}"
          grep -Fx 'host = "x86_64-linux-gnu"' dist/release-build-info.toml
      - name: Install release metadata tool runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev zlib1g-dev
          ldd dist/vix-release-tool | tee "$RUNNER_TEMP/release-tool-runtime.txt"
          ! grep -F 'not found' "$RUNNER_TEMP/release-tool-runtime.txt"
      - name: Require protected production signing inputs
        shell: bash
        env:
          VIX_RELEASE_SIGNING_KEY_HEX: ${{ secrets.VIX_RELEASE_SIGNING_KEY_HEX }}
        run: |
          set -euo pipefail
          [[ "$VIX_RELEASE_KEY_ID" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$VIX_RELEASE_AUTHORITY_PUBLIC_KEY_HEX" =~ ^[0-9A-Fa-f]{64}$ ]]
          test "$VIX_OFFICIAL_RELEASE_BASE_URL" = "https://github.com/$GITHUB_REPOSITORY/releases"
          test -n "${VIX_RELEASE_SIGNING_KEY_HEX:-}"
      - name: Sign the qualified archive metadata in the protected environment
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VIX_RELEASE_SIGNING_KEY_HEX: ${{ secrets.VIX_RELEASE_SIGNING_KEY_HEX }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/vix-signing"
          printf 'format = 1\n\n[[trusted-key]]\nkey-id = "%s"\nalgorithm = "ed25519"\npublic-key = "%s"\n' \
            "$VIX_RELEASE_KEY_ID" "$VIX_RELEASE_AUTHORITY_PUBLIC_KEY_HEX" \
            > "$RUNNER_TEMP/vix-signing/releases.toml"
          export VIX_RELEASE_TRUST_FILE="$RUNNER_TEMP/vix-signing/releases.toml"
          {
            printf 'version = "%s"\nchannel = "stable"\nsequence = %s\n\n' "$version" "${GITHUB_RUN_NUMBER}"
            printf '[[artifact]]\nid = "host-x86_64-linux-gnu"\nhost = "x86_64-linux-gnu"\n'
            host_archive="vix-x86_64-linux-gnu-${version}.tar.gz"
            printf 'location = "https://github.com/%s/releases/download/%s/%s"\narchive = "tar.gz"\nfile = "%s"\n\n' \
              "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$host_archive" "$host_archive"
            for target in android-arm64-v8a-api21 android-x86_64-api21 wasm32-wasip2; do
              asset="vix-sdk-${target}-${version}.tar.gz"
              test -s "dist/target-sdks/$asset"
              printf '[[component]]\nid = "%s"\nkind = "target-sdk"\ntarget = "%s"\n' "$target" "$target"
              printf 'location = "https://github.com/%s/releases/download/%s/%s"\narchive = "tar.gz"\nfile = "target-sdks/%s"\ninstall-path = "target-sdks"\n\n' \
                "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$asset" "$asset"
            done
          } > dist/release-spec.toml
          (cd dist && ./vix-release-tool --spec release-spec.toml)
          grep -Fx "version = \"$version\"" dist/release-manifest.toml
          grep -Fx 'host = "x86_64-linux-gnu"' dist/release-manifest.toml
          grep -Fx 'target = "wasm32-wasip2"' dist/release-manifest.toml
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish all qualified files atomically as a draft before promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" --draft --title "Vix $RELEASE_TAG" \
            --notes "Current Vix release. Verify archive provenance before use."
          gh release upload "$RELEASE_TAG" \
            "dist/vix-x86_64-linux-gnu-${version}.tar.gz" \
            "dist/vix-installer-x86_64-linux-gnu-${version}.tar.gz" \
            dist/target-sdks/*.tar.gz \
            dist/target-sdks/*.sha256 \
            dist/SHA256SUMS dist/release-build-info.toml \
            dist/release-manifest.toml dist/release-signature.toml \
            dist/runtime-dependencies-ldd.txt \
            dist/runtime-dependencies-readelf.txt dist/staged-runtime-check.txt
          gh release edit "$RELEASE_TAG" --draft=false
